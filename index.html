<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convertisseur d’images | byNativ</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="https://www.bynativ.com/"><img src="bynativ.svg" width="132" height="51" alt="byNativ — accueil"></a>
    </div>
  </header>
  <main>
    <h1>Convertisseur d’images</h1>
    <p class="intro">Préparez vos photos pour la photothèque byNativ.</p>
    <section aria-labelledby="conversion-title">
      <h2 id="conversion-title">Choisir les images à convertir</h2>
      <p>Le ZIP contient les originaux, les JPEG web de 800 px de haut et les vignettes de 160 px.</p>
      <div class="actions">
        <button class="primary" id="choose-files" type="button">Choisir des images</button>
        <button id="choose-folder" type="button">Choisir un dossier</button>
      </div>
      <input id="files" type="file" multiple hidden>
      <input id="folder" type="file" webkitdirectory multiple hidden>
      <p id="status" role="status"></p>
      <progress id="progress" aria-label="Progression de la conversion" hidden></progress>
      <ul id="errors" hidden></ul>
      <a class="button primary" id="download" download="phototheque.zip" hidden>Télécharger le ZIP</a>
    </section>
    <p class="privacy">Vos images restent sur cet appareil.</p>
  </main>
  <script src="app.js?v=2"></script>
</body>
</html>
